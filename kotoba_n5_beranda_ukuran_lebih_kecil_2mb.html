<style>
:root{--navy:#102b66;--blue:#176bc5;--yellow:#ffdc28;--pale:#edf5ff;--green:#27c34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent} 
html,body,button,a,[role="button"]{-webkit-tap-highlight-color:transparent;outline-color:transparent}
button,a,[role="button"]{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
button:focus,button:focus-visible,a:focus,a:focus-visible{outline:none;box-shadow:none}
button:active,a:active,[role="button"]:active{background-color:transparent}html,body{margin:0;min-height:100%;font-family:Nunito,system-ui,sans-serif;color:var(--navy)}body{background:#dceaff}.app{width:100%;max-width:620px;min-height:100svh;margin:auto;background:linear-gradient(#b9e5ff 0 29%,#eaf5ff 48%,#f4f7ff 100%);position:relative;overflow:hidden;padding-bottom:145px}
.brand{text-align:center;padding:7px 14px 0;position:relative;z-index:1}.brand h1{font-size:clamp(40px,10vw,64px);line-height:1;margin:0;color:#fff;letter-spacing:-2px;font-weight:900;-webkit-text-stroke:2px #153778;text-shadow:0 4px 0 #153778,2px 6px 0 #153778}.brand h1 span{color:#ffdc25}.brand p{display:inline-block;margin:10px 0 0;padding:7px 22px;border-radius:30px;background:#0874d5;color:white;font-size:clamp(14px,4vw,21px);font-weight:900;box-shadow:0 4px 0 #0757a9}
.scenery{height:245px;position:relative;margin-top:-2px;background:linear-gradient(#8bd5ff,#d7f1ff 68%,#7bd66e 69%,#5bc75c);overflow:hidden}.mountain{position:absolute;left:42%;top:24px;width:0;height:0;border-left:78px solid transparent;border-right:78px solid transparent;border-bottom:118px solid #fff;filter:drop-shadow(0 5px 0 #a9d9ed)}.mountain:after{content:"";position:absolute;left:-24px;top:0;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:38px solid #b9e3f5}.pagoda{position:absolute;right:3%;top:30px;font-size:74px;filter:drop-shadow(0 4px 1px #3985a5)}.torii{position:absolute;right:28%;top:118px;font-size:70px}.cloud{position:absolute;background:#fff;border-radius:40px;width:120px;height:32px;opacity:.85}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%;width:48px;height:48px;top:-20px}.cloud:before{left:18px}.cloud:after{right:16px;top:-13px}.c1{top:35px;left:5%}.c2{top:72px;right:8%;transform:scale(.7)}.blossom{position:absolute;left:2%;top:50px;font-size:64px}.hero{position:relative;margin-top:-206px;min-height:300px;display:flex;align-items:flex-end;padding:0 18px 15px;z-index:2;gap:0}.mascot{width:52%;max-width:300px;align-self:flex-end;filter:drop-shadow(0 6px 2px #14346b25)}.speech{background:white;border:4px solid #e7f3ff;border-radius:35px;padding:17px 15px;margin:0 0 45px -8px;flex:1;text-align:center;font-size:clamp(17px,4.4vw,25px);font-weight:900;line-height:1.25;box-shadow:0 5px 0 #c9e2fa}.spark{position:absolute;left:49%;top:18px;color:#ffcf19;font-size:35px;transform:rotate(-12deg)}
.progress{position:relative;z-index:3;margin:-18px 18px 17px;background:#fff;border:4px solid #e5f1ff;border-radius:27px;padding:13px 15px;display:flex;align-items:center;gap:13px;box-shadow:0 6px 0 #c8def5}.book{font-size:55px;line-height:1}.progress-info{flex:1;min-width:0}.progress-info strong{display:block;font-size:18px;line-height:1.15;font-weight:900}.bar{height:15px;background:#d5e1f2;border-radius:20px;margin-top:9px;overflow:hidden}.bar i{display:block;width:12%;height:100%;background:linear-gradient(#65ed47,#1dbd34);border-radius:20px}.percent{font-size:24px;font-weight:900}
.start{display:flex;align-items:center;justify-content:center;gap:15px;margin:0 28px 18px;width:calc(100% - 56px);height:72px;border:0;border-radius:38px;background:linear-gradient(#ffe94b,#ffc900);color:#102b66;font:900 clamp(22px,6vw,31px) Nunito,sans-serif;box-shadow:0 6px 0 #e9a900,0 10px 18px #b78b2733;cursor:pointer}.play{color:#ef293e;font-size:37px;text-shadow:0 2px #a91927}.arrow{color:#df4c12;font-size:34px}.shortcuts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 28px 20px}.shortcut{border:2px solid #e3efff;border-radius:25px;background:linear-gradient(#fff,#f5f8ff);min-height:140px;box-shadow:0 5px 0 #cbdcf1;padding:12px 5px;text-align:center;color:var(--navy);font:900 17px/1.15 Nunito,sans-serif;cursor:pointer}.shortcut .ico{display:block;font-size:43px;margin-bottom:7px}.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100vw);aspect-ratio:1536/325;height:auto;padding:0;margin:0;background:transparent;border:0;box-shadow:none;overflow:hidden}.nav-image{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}.nav-hit{position:absolute;z-index:2;top:0;bottom:0;width:33.333%;display:block;text-decoration:none;background:transparent;cursor:pointer}.nav-hit:nth-of-type(1){left:0}.nav-hit:nth-of-type(2){left:33.333%}.nav-hit:nth-of-type(3){left:66.666%}.nav-hit:focus-visible{outline:3px solid #fff;outline-offset:-8px;border-radius:24px}.toast{position:fixed;z-index:20;left:50%;bottom:92px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#102b66;color:#fff;padding:11px 18px;border-radius:22px;font-weight:800;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.hero-background{height:94vw;min-height:300px}.progress{margin-top:-14px}.bottom{height:82px;padding-inline:10px;gap:7px}.nav{font-size:12px}.nav .ico{width:28px;height:28px}.nav .ico svg{width:27px;height:27px}.scenery{height:220px}.hero{margin-top:-190px;min-height:275px;padding-inline:10px}.speech{padding:12px 9px;margin-bottom:36px}.progress{margin-inline:12px;padding:10px}.shortcuts{padding-inline:18px;gap:7px}.shortcut{font-size:15px;min-height:128px}.book{font-size:45px}}

.shortcut-art img{display:block;width:100%;height:auto;object-fit:contain}
.shortcut-art a{position:absolute;top:0;bottom:0;width:33.333%;z-index:2;border-radius:24px}
.shortcut-art a:nth-of-type(1){left:0}
.shortcut-art a:nth-of-type(2){left:33.333%}
.shortcut-art a:nth-of-type(3){left:66.666%}
.shortcut-art a:focus-visible{outline:3px solid #176bc5;outline-offset:-5px}

/* Penyatuan warna latar: mengikuti biru muda pada aset menu */
html, body { background: #cde5ff !important; }
.app { background: #cde5ff !important; }
.shortcuts { background: #cde5ff !important; }


/* Interaksi sentuhan: Soft 3D, tanpa highlight biru bawaan */
.start,
.shortcut-art a,
.nav-hit {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
.start {
  position: relative;
  transform: translateY(0) scale(1);
  transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
  will-change: transform;
}
.start:active {
  transform: translateY(5px) scale(.985);
  box-shadow: 0 1px 0 #e9a900, 0 3px 8px #b78b2730;
  filter: saturate(1.04);
}
.shortcut-art a {
  display: block;
  transform: scale(1);
  transition: transform 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
  transform-origin: center;
  -webkit-tap-highlight-color: transparent;
}
.shortcut-art a:active {
  transform: scale(.955);
  background: rgba(255,255,255,.16);
  box-shadow: inset 0 3px 7px rgba(20,65,130,.12);
}
.nav-hit {
  transition: transform 140ms ease;
  -webkit-tap-highlight-color: transparent;
}
.nav-hit::after {
  content: "";
  position: absolute;
  inset: 10% 8%;
  border-radius: 25px;
  background: rgba(255,255,255,0);
  transition: background-color 140ms ease, transform 140ms ease;
  pointer-events: none;
}
.nav-hit:active {
  transform: scale(.965);
}
.nav-hit:active::after {
  background: rgba(255,255,255,.10);
  transform: scale(.98);
}
.start:focus-visible,
.shortcut-art a:focus-visible,
.nav-hit:focus-visible {
  outline: 3px solid rgba(255,255,255,.9);
  outline-offset: -5px;
}
@media (prefers-reduced-motion: reduce) {
  .start, .shortcut-art a, .nav-hit, .nav-hit::after { transition: none !important; }
}

<script>
/* Persentase dihitung dari bab yang selesai. Halaman materi dapat memanggil
   window.setKotobaProgress(jumlahBabSelesai, 25) setelah bab dituntaskan. */
(function(){
  const fill=document.getElementById('kotobaProgressFill');
  const label=document.getElementById('kotobaProgressPercent');
  if(!fill||!label) return;
  const TOTAL=25;
  function readProgress(){
    let completed=null, total=TOTAL;
    try{
      const raw=localStorage.getItem('kotobaProgress');
      if(raw){
        const obj=JSON.parse(raw);
        if(obj && typeof obj==='object'){
          if(Number.isFinite(Number(obj.completed))) completed=Number(obj.completed);
          if(Number.isFinite(Number(obj.total)) && Number(obj.total)>0) total=Number(obj.total);
        }
      }
      if(completed===null){
        const direct=localStorage.getItem('kotobaProgressCompleted');
        if(direct!==null && Number.isFinite(Number(direct))) completed=Number(direct);
      }
      if(completed===null){
        const candidates=['kotobaCompletedBab','completedBab','completedChapters','completedDays'];
        for(const key of candidates){
          const value=localStorage.getItem(key);
          if(value){
            const parsed=JSON.parse(value);
            if(Array.isArray(parsed)){ completed=new Set(parsed.map(String)).size; break; }
            if(parsed && typeof parsed==='object'){ completed=Object.values(parsed).filter(Boolean).length; break; }
          }
        }
      }
    }catch(e){}
    if(completed===null) completed=3; // mempertahankan angka awal 12% sampai data progres tersedia
    completed=Math.max(0,Math.min(total,completed));
    return {completed,total,percent:Math.round(completed/total*100)};
  }
  function render(){
    const p=readProgress();
    fill.style.width=p.percent+'%';
    label.textContent=p.percent+'%';
    label.setAttribute('aria-label',p.completed+' dari '+p.total+' bab selesai');
  }
  window.setKotobaProgress=function(completed,total=TOTAL){
    const c=Math.max(0,Math.min(Number(total)||TOTAL,Number(completed)||0));
    try{
      localStorage.setItem('kotobaProgress',JSON.stringify({completed:c,total:Number(total)||TOTAL}));
      localStorage.setItem('kotobaProgressCompleted',String(c));
    }catch(e){}
    render();
  };
  window.addEventListener('storage',render);
  render();
})();
</script>
